radius:8px;display:grid;place-items:center}.row-action:hover{border-color:#b9c5e6;color:#4f46e5;background:#f7f7ff}.row-action.danger:hover{color:#dc3143;border-color:#ffc6cf;background:#fff5f6}.row-action span{font-size:16px}.check{width:16px;height:16px;accent-color:#5c4ce9}.table-footer{min-height:48px;padding:8px 12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:11.5px}.pagination{display:flex;gap:4px}.pagination button{width:31px;height:31px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:7px}.pagination button.active{background:#8b3527;color:#fff;border-color:#8b3527}.bulk-bar{display:flex;align-items:center;gap:8px;padding:9px 11px;margin-bottom:8px;border:1px solid #cfd5fa;border-radius:10px;background:#f7f7ff;color:#4236bd}.bulk-bar strong{margin-right:auto}

/* cards */
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.entity-card{padding:15px;position:relative;overflow:hidden}.entity-card:hover{border-color:#c9d0ec;box-shadow:0 14px 35px rgba(44,60,123,.12);transform:translateY(-1px)}.entity-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}.entity-title{display:flex;gap:10px;min-width:0}.entity-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#6b5af0,#4256e4);color:white;display:grid;place-items:center;flex:0 0 auto}.entity-title h3{font-size:14px;margin:1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entity-title p{font-size:11px;color:var(--muted);margin:0}.entity-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}.entity-meta small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.entity-meta strong{font-size:11.5px}.progress{height:7px;border-radius:10px;background:#edf0f6;overflow:hidden}.progress span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#6a57f1,#3982f0)}.entity-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px}.people-stack{display:flex}.people-stack .avatar{margin-left:-6px;border:2px solid var(--surface);width:28px;height:28px;font-size:9px}.people-stack .avatar:first-child{margin-left:0}

/* tabs */
.subtabs{display:flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);width:max-content;max-width:100%;overflow:auto}.subtabs button{height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:700;padding:0 10px;white-space:nowrap}.subtabs button.active{background:var(--surface);color:#5245df;box-shadow:0 2px 8px rgba(41,54,102,.08)}

/* calendar */
.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.calendar-card{padding:13px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-head h2{margin:0;font-size:17px}.calendar-week{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.calendar-week>div{padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line)}.calendar-day{min-height:112px;padding:7px;border-right:1px solid var(--line);border-top:1px solid var(--line);background:var(--surface);position:relative}.calendar-day.outside{background:var(--surface-2);color:var(--muted-2)}.calendar-day.today{box-shadow:inset 0 0 0 2px rgba(88,73,231,.55)}.calendar-date{font-size:11px;font-weight:700}.calendar-event{margin-top:5px;padding:5px 6px;border-radius:6px;font-size:10px;line-height:1.3;background:#f0f4ff;color:#3553ad;border-left:3px solid #5f65ef;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.calendar-event.overdue{background:#fff0f2;color:#b42335;border-left-color:#ef4055}.calendar-event.done{background:#eafaf4;color:#087859;border-left-color:#20b981}.agenda{padding:14px}.agenda-list{max-height:680px;overflow:auto}.agenda-item{padding:10px 0;border-bottom:1px solid var(--line)}.agenda-item strong{font-size:12px;display:block}.agenda-item small{color:var(--muted);display:block;margin-top:3px}

/* forms / modal */
.modal-overlay{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(11,19,44,.46);backdrop-filter:blur(3px)}.modal{width:min(760px,calc(100vw - 30px));max-height:calc(100vh - 36px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden}.modal.wide{width:min(1120px,calc(100vw - 30px))}.modal.xwide{width:min(1380px,calc(100vw - 22px))}.modal.small{width:min(480px,calc(100vw - 30px))}.modal-head{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 17px;border-bottom:1px solid var(--line);background:var(--surface)}.modal-head h2{font-size:20px;margin:0}.modal-head p{font-size:11.5px;color:var(--muted);margin:3px 0 0}.modal-close{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--text);display:grid;place-items:center}.modal-body{padding:15px 17px;overflow:auto}.modal-footer{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px;background:var(--surface)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}.form-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.form-field.full{grid-column:1/-1}.form-field label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;margin-bottom:6px}.required{color:#e04455}.form-field input,.form-field textarea,.form-field .fake-select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;outline:0;font-size:13px}.form-field input{height:var(--input-h);padding:0 10px}.form-field textarea{min-height:82px;resize:vertical;padding:9px 10px;line-height:1.45}.form-field input:focus,.form-field textarea:focus{border-color:#8172ef;box-shadow:0 0 0 3px rgba(90,72,238,.08)}.form-field input[readonly]{background:var(--surface-2);color:var(--muted)}.field-help{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.info-icon{border:0;background:transparent;color:#8492ad;padding:0;display:grid;place-items:center}.info-icon span{font-size:15px}.form-section{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:12px}.form-section-title{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}.form-section-title span{font-size:17px;color:#5e52e7}

/* custom combobox */
.combo{position:relative;min-width:0}.combo-control{appearance:none;width:100%;min-width:0;min-height:var(--input-h);border:1px solid #cfae7f;background:#fffcf7;color:var(--text);border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 11px;transition:border-color .15s,box-shadow .15s;text-align:left}.combo.open .combo-control,.combo-control:focus-within{border-color:#8172ef;box-shadow:0 0 0 3px rgba(90,72,238,.08)}.combo-control input{height:38px!important;border:0!important;box-shadow:none!important;padding:0 5px!important;min-width:0;flex:1}.combo-arrow{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:3px}.combo-arrow span{font-size:18px}.combo-menu{position:fixed;z-index:var(--z-menu);min-width:220px;max-height:260px;overflow:auto;border:1px solid #d1d9eb;background:var(--surface);border-radius:10px;box-shadow:0 18px 45px rgba(31,45,92,.18);padding:5px}.combo-option{min-height:36px;display:flex;align-items:center;padding:6px 9px;border-radius:7px;color:var(--text);cursor:pointer;font-size:12.5px}.combo-option:hover,.combo-option.active{background:#f0f2ff;color:#4f43d6}.combo-option.selected{font-weight:700}.combo-empty{padding:10px;color:var(--muted);font-size:11.5px}.combo-option small{margin-left:auto;color:var(--muted);font-size:10px}

/* multi select */
.multi-select-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.multi-select-search{padding:7px;border-bottom:1px solid var(--line);background:var(--surface-2)}.multi-select-search input{height:34px!important}.multi-options{max-height:190px;overflow:auto;padding:5px}.multi-option{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px}.multi-option:hover{background:var(--surface-2)}.multi-option label{font-weight:500;margin:0;flex:1}.selected-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.person-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 8px 3px 4px;font-size:11px}.person-chip .avatar{width:24px;height:24px;font-size:8px}.person-chip button{border:0;background:transparent;color:var(--muted);padding:0;display:grid;place-items:center}.person-chip button span{font-size:14px}

/* wizard */
.wizard-steps{display:flex;align-items:center;gap:0;padding:12px 17px;border-bottom:1px solid var(--line);background:var(--surface-2)}.wizard-step{display:flex;align-items:center;gap:8px;flex:1;position:relative;font-size:12px;font-weight:800;color:var(--muted)}.wizard-step:after{content:"";height:2px;background:var(--line);position:absolute;left:38px;right:8px;top:15px}.wizard-step:last-child:after{display:none}.wizard-step-number{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}.wizard-step.active{color:#5043dc}.wizard-step.active .wizard-step-number,.wizard-step.done .wizard-step-number{background:#5a4ae7;color:#fff;border-color:#5a4ae7}.wizard-step.done:after{background:#9188f6}.wizard-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.wizard-grid-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:52vh}.wizard-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1280px}.wizard-table th{position:sticky;top:0;z-index:3;height:42px;background:var(--surface-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 7px;text-align:left;font-size:11.5px}.wizard-table td{padding:5px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;background:var(--surface)}.wizard-table td:last-child,.wizard-table th:last-child{border-right:0}.wizard-table input,.wizard-table textarea{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);padding:0 7px;width:100%;font-size:12px;outline:0}.wizard-table textarea{height:52px;padding-top:6px}.wizard-table input.invalid{border-color:#f16675;background:#fff7f8}.row-status{width:9px;height:9px;border-radius:50%;background:#b4bfd1}.row-status.valid{background:#1db780}.row-status.invalid{background:#ef4055}.wizard-error-summary{border:1px solid #ffd0d5;background:#fff5f6;color:#a32634;padding:10px;border-radius:9px;font-size:12px;margin-bottom:8px}.wizard-review{display:grid;gap:8px}.review-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.review-row strong{font-size:12px}.review-row p{font-size:11px;color:var(--muted);margin:3px 0 0}.upload-chip{display:flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-size:10.5px;max-width:190px}.upload-chip span.material-symbols-rounded{font-size:14px}.file-input-inline{max-width:200px}

/* upload */
.upload-zone{border:1.5px dashed #bfc9dd;border-radius:12px;padding:13px;background:var(--surface-2);display:flex;align-items:center;gap:11px;transition:.18s}.upload-zone.dragover{border-color:#6758ed;background:#f4f2ff}.upload-zone-icon{width:38px;height:38px;border-radius:10px;background:#eeecff;color:#5e51e5;display:grid;place-items:center}.upload-zone-copy{flex:1}.upload-zone-copy strong{display:block;font-size:12px}.upload-zone-copy small{font-size:10.5px;color:var(--muted)}.pending-files{display:flex;flex-direction:column;gap:5px;margin-top:8px}.file-chip{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:7px;background:var(--surface)}.file-chip-icon{width:30px;height:30px;border-radius:8px;background:#eef2ff;color:#5764df;display:grid;place-items:center}.file-chip strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-chip small{color:var(--muted);font-size:10px}.file-chip-actions{display:flex;gap:3px}.file-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.file-card{padding:11px}.file-card-top{display:flex;gap:9px}.file-type{width:42px;height:42px;border-radius:11px;background:#eef2ff;color:#5261de;display:grid;place-items:center}.file-card h3{font-size:12px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-card p{font-size:10.5px;color:var(--muted);margin:0}.file-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}

/* profile drawer */
.profile-tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);padding:0 16px}.profile-tabs button{height:39px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:700}.profile-tabs button.active{color:#5145df;border-bottom-color:#5a4be7}.profile-hero{display:flex;gap:14px;align-items:center;padding:15px;border-radius:12px;background:linear-gradient(120deg,#f2f0ff,#eef8ff);border:1px solid #dce2f4}.profile-hero .avatar{width:58px;height:58px;font-size:17px}.profile-hero h2{font-size:17px;margin:0 0 4px}.profile-hero p{color:#68758e;margin:0;font-size:11.5px}.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.profile-stat{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--surface)}.profile-stat small{display:block;color:var(--muted);font-size:10px}.profile-stat strong{display:block;font-size:17px;margin-top:4px}

/* reports */
.report-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report-card{padding:15px;cursor:pointer;transition:.18s}.report-card:hover{transform:translateY(-2px);border-color:#c9d0ee}.report-card-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#6455ee,#3d68dd);color:#fff;display:grid;place-items:center}.report-card h3{font-size:14px;margin:10px 0 5px}.report-card p{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0}.report-preview{margin-top:10px;padding:15px}.report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.report-summary .stat{border:1px solid var(--line);border-radius:10px;padding:10px}.report-summary small{display:block;color:var(--muted);font-size:10px}.report-summary strong{display:block;font-size:20px;margin-top:4px}

/* Help */


/* floating menus */
.floating-menu{position:fixed;z-index:var(--z-menu);min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 18px 50px rgba(33,45,91,.18);padding:5px}.floating-menu button{width:100%;min-height:37px;border:0;background:transparent;color:var(--text);border-radius:7px;display:flex;align-items:center;gap:8px;text-align:left;padding:5px 9px;font-weight:600}.floating-menu button:hover{background:var(--surface-2);color:#5547dd}.floating-menu button span{font-size:17px}.period-menu{min-width:180px}

/* preview */
.preview-overlay{position:fixed;inset:0;z-index:var(--z-preview);background:rgba(10,17,39,.68);display:flex;align-items:center;justify-content:center;padding:18px}.preview-modal{width:min(1100px,calc(100vw - 30px));height:min(790px,calc(100vh - 30px));border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(0,0,0,.25)}.preview-head{height:62px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.preview-title{min-width:0}.preview-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.preview-title small{color:var(--muted);font-size:10px}.preview-actions{display:flex;gap:5px}.preview-body{flex:1;min-height:0;background:#eef1f6;display:grid;place-items:center;overflow:auto;padding:12px}.preview-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}.preview-body iframe{width:100%;height:100%;border:0;background:white;border-radius:6px}.preview-text{width:100%;height:100%;margin:0;background:#121828;color:#e8edf6;border-radius:8px;padding:15px;overflow:auto;white-space:pre-wrap;font-family:monospace;font-size:12px}.preview-fallback{text-align:center;color:#58657b}.preview-fallback span{font-size:56px;color:#7a86a0}.preview-fallback h3{font-size:15px;color:#28364f}.preview-loading{display:flex;flex-direction:column;align-items:center;gap:10px;color:#66738a}.spinner{width:27px;height:27px;border-radius:50%;border:3px solid #dce2ee;border-top-color:#5a4ae7;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* confirm */
.confirm-overlay{position:fixed;inset:0;z-index:1300;background:rgba(11,19,43,.48);display:grid;place-items:center;padding:20px}.confirm-box{width:min(430px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:18px}.confirm-icon{width:42px;height:42px;border-radius:12px;background:#fff0f2;color:#e53d52;display:grid;place-items:center;margin-bottom:10px}.confirm-box h3{font-size:17px;margin:0 0 6px}.confirm-box p{color:var(--muted);font-size:12px;line-height:1.5;margin:0}.confirm-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}

/* toast */
.toast-container{position:fixed;right:17px;bottom:17px;z-index:var(--z-toast);display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:none}.toast{width:min(360px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 17px 45px rgba(28,41,88,.18);padding:10px 11px;display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:start;pointer-events:auto;animation:toastIn .24s ease}.toast-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}.toast.processing .toast-icon{background:#f0efff;color:#5b4be6}.toast.success .toast-icon{background:#eafaf4;color:#15a579}.toast.error .toast-icon{background:#fff0f2;color:#df3b50}.toast.warning .toast-icon{background:#fff7e7;color:#de9414}.toast-icon span{font-size:17px}.toast-copy strong{display:block;font-size:11.5px}.toast-copy p{font-size:10.5px;color:var(--muted);margin:3px 0 0;line-height:1.35}.toast-time{font-size:9.5px;color:var(--muted)}@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* tooltip */
